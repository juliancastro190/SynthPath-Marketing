# Deploy build config — see DEPLOY.md. Runs the Discord bridge, which also
# starts the heartbeat in the background (one process, one shared data/
# volume, instead of two separate deployments with diverging state).
#
# Only the start command is overridden here. An earlier version of this
# file also overrode [phases.install] to use a lean, deploy-specific
# requirements file (avoiding Tier 3's voice packages, which aren't
# reachable from discord_main.py's import chain at all) — but that broke
# the build ("No module named pip"): overriding the install phase drops
# whatever step Nixpacks' auto-detected Python provider normally uses to
# set pip up, even though a live build on this exact platform, fully
# auto-detected with no nixpacks.toml involved, installed the complete
# requirements.txt (voice packages included) without any problem. So:
# don't fight what's already proven to work — let Nixpacks auto-manage
# setup and install, override only the one thing that actually needs it.

[start]
cmd = "python discord_main.py"
