# Deploy build config — see DEPLOY.md. Runs the Discord bridge, which also
# starts the heartbeat in the background (one process, one shared data/
# volume, instead of two separate deployments with diverging state).
#
# Nixpacks would otherwise auto-detect Python and run `pip install -r
# requirements.txt`, which includes Tier 3's voice packages (sounddevice
# needs the PortAudio system library; pynput needs a display). Neither is
# reachable from discord_main.py's actual import chain, so this
# explicitly overrides the install phase to use the lean, deploy-specific
# requirements file instead.
#
# To deploy the heartbeat alone instead (no Discord chat), change both
# lines below to requirements-heartbeat.txt and heartbeat_main.py.
#
# `python -m pip`, not bare `pip`: overriding this phase drops whatever
# step Nixpacks' auto-detected Python provider normally uses to put a
# `pip` binary on PATH, so a bare `pip install` 127s with "command not
# found" even though python3 itself installed fine (see the `setup`
# phase, which this file leaves alone).

[phases.install]
cmds = ["python -m pip install -r requirements-discord.txt"]

[start]
cmd = "python discord_main.py"
