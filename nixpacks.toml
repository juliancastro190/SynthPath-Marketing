# Deploy build config for hosting the heartbeat (see DEPLOY.md) — Nixpacks
# would otherwise auto-detect Python and run `pip install -r
# requirements.txt`, which includes Tier 3's voice packages (sounddevice
# needs the PortAudio system library; pynput needs a display). Neither is
# reachable from heartbeat_main.py's actual import chain, so this
# explicitly overrides the install phase to use the lean,
# deploy-specific requirements file instead.

[phases.install]
cmds = ["pip install -r requirements-heartbeat.txt"]

[start]
cmd = "python heartbeat_main.py"
